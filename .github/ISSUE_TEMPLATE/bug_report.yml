name: Bug report
description: Report something that does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove API keys and private prompts from everything you paste here.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 1.2.0
    validations:
      required: true
  - type: input
    id: flutter
    attributes:
      label: Flutter version and platform
      placeholder: 3.47.8 on web
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      multiple: true
      options: [OpenAI, Anthropic, Gemini, OpenRouter, Custom adapter]
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include your `ProviderConfig` list with keys removed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Attempt logs
      description: Output of `router.lastAttemptLogs`, if available.
      render: text
