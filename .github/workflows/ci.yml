name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter: stable
            channel: stable
          - flutter: minimum
            channel: stable
            version: 3.32.0
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter pub get
      - name: Check formatting
        if: matrix.flutter == 'stable'
        run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Test on web
        if: matrix.flutter == 'stable'
        run: flutter test --platform chrome
      - uses: actions/upload-artifact@v4
        if: matrix.flutter == 'stable'
        with:
          name: coverage
          path: coverage/lcov.info

  package:
    name: Package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y webp
      - run: flutter pub get
      - run: dart pub publish --dry-run
      # Up to 10 points are lost to WASM compatibility, which comes from
      # firebase_ai through flutter_ai_toolkit.
      - name: Check pub points
        run: |
          dart pub global activate pana
          dart pub global run pana --exit-code-threshold 10 .

  example:
    name: Example (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: web
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ${{ matrix.target }}
