include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
    - ios/**
    - windows/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # The demo subclasses BaseLlmAdapter, which stays internal to the package.
    implementation_imports: false
