include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unused_import: error
    unused_local_variable: warning
    dead_code: warning
  exclude:
    - build/**

linter:
  rules:
    public_member_api_docs: true
