name: flutter_llm_router
description: "A resilient multi-provider LLM router for Flutter AI Toolkit featuring transparent failover, token cost tracking, and attempt logging."
version: 1.1.0
repository: https://github.com/open-source-collabs/flutter_llm_router
issue_tracker: https://github.com/open-source-collabs/flutter_llm_router/issues

environment:
  sdk: ^3.7.0
  flutter: ">=3.27.0"

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  flutter:
    sdk: flutter
  flutter_ai_toolkit: ^1.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

screenshots:
  - description: 'Failover: when one provider returns HTTP 429, the router moves on to the next and the chat keeps streaming.'
    path: screenshots/failover.png
  - description: 'Live cost tracking: per-token prices on each provider feed a listenable total you can bind to a label.'
    path: screenshots/cost-tracking.png
  - description: 'Quickstart: configure providers once and pass the router to LlmChatView.'
    path: screenshots/quickstart.png

topics:
  - ai
  - llm
  - flutter-ai-toolkit
  - cost-tracking
  - failover

